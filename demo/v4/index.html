<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spiritual Care v4 Demo</title>
<meta name="theme-color" content="#FFFDF8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1F2218" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+Sans+SC:wght@500;700&display=swap">
<style>
/* v4 demo. Akouō's shell and type on the Spiritual Care Session Tool.
   Phone: slim top bar + fixed bottom stepper. Laptop (900px+): steps move into the top bar. */
:root{
  --paper:#F5F2EA; --sheet:#FFFDF8; --ink:#2A2E22; --muted:#666A58; --rule:#DCD7C8; --rule-soft:#ECE8DC;
  --rubric:#5D6B3F; --rubric-soft:#E7EADB; --on-rubric:#FFFFFF; --blue:#4A5632; --blue-soft:#EEF0E3; --amber:#B07A1E;
  --good:#2B6B58; --good-soft:#DDEEE7; --warn:#8A5A0E; --warn-soft:#F6E9D2; --stop:#A3332A; --stop-soft:#F5E1DD;
  --shadow:0 1px 2px rgba(50,45,25,.06),0 4px 16px rgba(50,45,25,.05);
  --f-display:"Alegreya",Georgia,"Times New Roman",serif;
  --f-body:"Alegreya Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-label:"Alegreya Sans SC","Alegreya Sans",system-ui,sans-serif;
  --nav-h:64px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --paper:#16180F; --sheet:#1F2218; --ink:#ECEADF; --muted:#A6A894; --rule:#353A29; --rule-soft:#2A2E20;
  --rubric:#AABA7E; --rubric-soft:#2E3522; --on-rubric:#16180F; --blue:#C3D09A; --blue-soft:#272D1D; --amber:#E0B25C;
  --good:#7FC8AE; --good-soft:#1B3029; --warn:#E5B866; --warn-soft:#3A2F17; --stop:#E68A7F; --stop-soft:#3B2420;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
.gut{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.col{max-width:760px;margin:0 auto}

.demo-band{background:var(--amber);color:#fff;text-align:center;font-family:var(--f-label);letter-spacing:.06em;font-size:.82rem;padding:5px 12px}
.top{position:sticky;top:0;z-index:5;background:var(--sheet);border-bottom:1px solid var(--rule);padding-top:env(safe-area-inset-top)}
.top .col{display:flex;align-items:center;gap:10px;min-height:54px;max-width:1040px}
.brand{font-family:var(--f-display);font-style:italic;font-weight:600;font-size:1.2rem;white-space:nowrap;text-decoration:none;color:var(--ink)}
.brand b{color:var(--amber)}
.who{font-family:var(--f-label);font-size:.85rem;letter-spacing:.05em;color:var(--rubric);background:var(--rubric-soft);border-radius:999px;padding:3px 10px;white-space:nowrap}
.spacer{flex:1}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;color:var(--muted);white-space:nowrap;border:0;background:transparent;padding:6px 4px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.sync[data-s=locked] i{background:var(--good)}
.hdr-learn{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-label);font-weight:500;letter-spacing:.04em;color:var(--muted);text-decoration:none;padding:6px 8px;border-radius:7px}
.hdr-learn[aria-current=page]{color:var(--rubric);background:var(--rubric-soft)}
.hdr-learn svg{width:18px;height:18px}
.steplinks{display:none;gap:2px}
.steplinks a{font-family:var(--f-label);font-weight:500;letter-spacing:.04em;color:var(--muted);text-decoration:none;padding:6px 9px;border-radius:7px;font-size:.92rem;white-space:nowrap}
.steplinks a[aria-current=page]{color:var(--rubric);background:var(--rubric-soft)}
.steplinks a.done::after{content:" ✓";color:var(--good)}

.stepbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--sheet);border-top:1px solid var(--rule);display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;min-height:var(--nav-h);padding:6px max(12px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.stepbar .nav{border:1px solid var(--rule);background:var(--sheet);border-radius:10px;min-height:46px;padding:0 16px;font-weight:500;color:var(--blue)}
.stepbar .nav.primary{background:var(--rubric);border-color:var(--rubric);color:var(--on-rubric)}
.stepbar .nav:disabled{opacity:.35}
.stepnow{border:0;background:transparent;text-align:center;min-width:0;padding:4px}
.stepnow small{display:block;font-family:var(--f-label);letter-spacing:.06em;font-size:.78rem;color:var(--muted)}
.stepnow b{display:block;font-family:var(--f-display);font-size:1.12rem;line-height:1.2}
.dots{display:flex;gap:4px;justify-content:center;margin-top:3px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--rule)}
.dots i.done{background:var(--good)}.dots i.now{background:var(--rubric);width:16px;border-radius:4px}
main{padding-top:18px;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 30px)}
main.home{padding-bottom:48px}
@media (min-width:900px){
  .steplinks{display:flex}
  .stepnow{visibility:hidden}
  .stepbar{padding-left:calc(50vw - 380px);padding-right:calc(50vw - 380px)}
}
@media (max-width:640px){
  .top.insess .brand{display:none}
  .hdr-learn span{display:none}
}

.sheet-back{position:fixed;inset:0;background:rgba(20,22,15,.4);z-index:8;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--sheet);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:var(--shadow)}
.sheet h3{margin:4px 0 10px}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--rule);margin:0 auto 8px}

.eyebrow{font-family:var(--f-label);letter-spacing:.06em;font-size:.9rem;color:var(--muted);margin:0}
h2.big{font-family:var(--f-display);font-weight:600;font-size:1.9rem;line-height:1.15;margin:2px 0 0;text-wrap:balance}
h3.sec{font-family:var(--f-label);font-weight:700;letter-spacing:.06em;font-size:.92rem;color:var(--rubric);margin:0}
.muted{color:var(--muted)}.small{font-size:.9rem}
.stack{display:flex;flex-direction:column;gap:14px}
.stack-lg{display:flex;flex-direction:column;gap:26px}
.ref{color:var(--muted);font-size:.9rem}

.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:640px){.actions{grid-template-columns:minmax(0,1fr)}}
.act{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:16px;box-shadow:var(--shadow);min-width:0}
@media (max-width:640px){.act{flex-direction:row;align-items:center;gap:14px}}
.act .glyph{font-family:var(--f-display);font-weight:700;font-size:2rem;line-height:1;color:var(--amber);width:1.3em;flex:none}
.act b{font-family:var(--f-display);font-size:1.2rem;display:block}
.act span{color:var(--muted);font-size:.92rem;display:block}
.act:hover{border-color:var(--muted)}

.card{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.card.flat{box-shadow:none}
.list{list-style:none;margin:0;padding:0;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.list li + li{border-top:1px solid var(--rule-soft)}
.check{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;padding:12px 14px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--rubric);margin:2px 0 0}
.check b{font-family:var(--f-display);font-size:1.06rem;font-weight:400;display:block;line-height:1.3}
.check small{display:block;color:var(--muted);font-size:.88rem}
.check.on{background:var(--rubric-soft)}
.check.flag.on{background:var(--stop-soft)}

.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld > span{font-size:.86rem;color:var(--muted);font-weight:500}
input[type=text],input[type=password],select,textarea{width:100%;background:var(--sheet);border:1px solid var(--rule);border-radius:9px;padding:10px 12px;line-height:1.45;font-size:16px}
textarea{resize:vertical;min-height:80px;font-family:var(--f-display);font-size:1.08rem}
.ask{font-family:var(--f-display);font-style:italic;color:var(--blue);margin:0;font-size:1.08rem}
.ask::before{content:"“"}.ask::after{content:"”"}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--rule);background:var(--sheet);border-radius:9px;padding:9px 14px;font-weight:500;font-size:.98rem;white-space:nowrap;min-height:44px}
.btn.primary{background:var(--rubric);border-color:var(--rubric);color:var(--on-rubric)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--blue)}
.btns{display:flex;gap:8px;flex-wrap:wrap}

.pill{display:inline-block;font-size:.74rem;font-family:var(--f-label);font-weight:700;letter-spacing:.05em;padding:2px 9px;border-radius:999px;background:var(--rule-soft);color:var(--muted);white-space:nowrap}
.pill[data-v=stop]{background:var(--stop-soft);color:var(--stop)}
.pill[data-v=warn]{background:var(--warn-soft);color:var(--warn)}
.pill[data-v=go]{background:var(--good-soft);color:var(--good)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:7px 14px;font-size:.95rem}
.chip[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--sheet);padding:8px 12px;font-size:.92rem;min-width:44px;min-height:40px}
.seg button + button{border-left:1px solid var(--rule)}
.seg button[aria-pressed=true][data-v=pass]{background:var(--good-soft);color:var(--good);font-weight:700}
.seg button[aria-pressed=true][data-v=unclear]{background:var(--warn-soft);color:var(--warn);font-weight:700}
.seg button[aria-pressed=true][data-v=fail]{background:var(--stop-soft);color:var(--stop);font-weight:700}
.tlist{display:flex;flex-direction:column}
.test{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--rule-soft)}
.test:first-child{border-top:0;padding-top:0}
.test-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.test-head .q{min-width:0;flex:1 1 220px}
.test-head .q b{font-family:var(--f-display);font-size:1.08rem;display:block;line-height:1.3}
.tn{display:inline-grid;place-items:center;width:1.5em;height:1.5em;border-radius:50%;background:var(--rubric-soft);color:var(--rubric);font-size:.78rem;font-weight:700;margin-right:5px;vertical-align:.1em}
.prior{font-size:.82rem;color:var(--warn)}
.verdict{border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;background:var(--rule-soft)}
.verdict b{font-family:var(--f-display);font-size:1.2rem}
.verdict p{margin:0}
.verdict[data-v=stop]{background:var(--stop-soft)} .verdict[data-v=stop] b{color:var(--stop)}
.verdict[data-v=warn]{background:var(--warn-soft)} .verdict[data-v=warn] b{color:var(--warn)}
.verdict[data-v=go]{background:var(--good-soft)} .verdict[data-v=go] b{color:var(--good)}
.verdict .next{font-family:var(--f-label);letter-spacing:.05em;font-size:.86rem;color:var(--muted);margin-top:4px}

/* guide card that shrinks to a bar */
.guide{background:var(--blue-soft);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.guide-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.guide-lead{margin:0;font-family:var(--f-display);font-size:1.1rem;line-height:1.4}
.guide ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:.96rem}
.guide ul li::marker{color:var(--amber)}
.guide-mini{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;border:1px dashed var(--rule);background:transparent;border-radius:12px;padding:10px 14px;font-family:var(--f-display);font-size:1.02rem;text-align:left}
.guide-show{font-family:var(--f-body);font-size:.9rem;color:var(--blue);font-weight:500}

details.more{background:var(--sheet);border:1px solid var(--rule);border-radius:12px}
details.more > summary{list-style:none;cursor:pointer;padding:13px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.more > summary::-webkit-details-marker{display:none}
details.more > summary b{font-family:var(--f-display);font-size:1.1rem;font-weight:600}
details.more > summary::after{content:"+";color:var(--blue);font-size:1.3rem;line-height:1}
details.more[open] > summary::after{content:"−"}
details.more .list{border:0;border-top:1px solid var(--rule-soft);border-radius:0}
.note{font-size:.9rem;color:var(--muted);padding:0 14px 10px;margin:0}

.geno-mini{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;align-items:center}
.geno-mini svg{width:120px;height:auto}
.gl{fill:none;stroke:var(--ink);stroke-width:1.4}.gs{fill:var(--sheet);stroke:var(--ink);stroke-width:1.5}.ga{fill:var(--amber);fill-opacity:.35;stroke:var(--amber);stroke-width:2}

details.lesson{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow)}
details.lesson > summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
details.lesson > summary::-webkit-details-marker{display:none}
.lnum{font-family:var(--f-display);font-weight:700;font-size:1.9rem;line-height:1;color:var(--amber);width:1.1em;text-align:center}
.ltitle b{display:block;font-family:var(--f-display);font-size:1.15rem;line-height:1.25}
.ltitle span{display:block;color:var(--muted);font-size:.92rem;margin-top:2px}
.lbody{padding:0 16px 18px;display:flex;flex-direction:column;gap:10px}
.ideas{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;max-width:65ch}
.ideas li::marker{color:var(--amber)}
.balance{background:var(--rubric-soft);border-radius:10px;padding:12px 14px}
.balance b{font-family:var(--f-display)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 14px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:9px;font-size:.95rem;z-index:20;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.compare{border-left:3px solid var(--amber);padding:4px 0 4px 12px;font-size:.92rem;color:var(--muted)}
.compare b{color:var(--ink);font-weight:500}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="demo-band">DEMO OF THE v4 LOOK · SAMPLE PERSON · NOTHING IS SAVED</div>
<div id="app"></div>
<div class="toast" id="toast" role="status" hidden></div>
<script>
const STEPS=[["intake","Intake"],["safety","Safety"],["triage","Triage"],["doors","Doors"],["discern","Discern"],["ministry","Ministry"],["plan","Plan"]];
const S={done:new Set([0]),tests:{christ:'pass',scripture:'pass',selfcontrol:'unclear'},kinds:new Set(['root']),depth:'',safety:new Set(),guideHidden:{},saved:false,sheet:false};
const ICON_LEARN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/></svg>';
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function route(){const h=location.hash.slice(1)||'home';if(h.startsWith('s/')){const i=+h.slice(2);return {name:'step',i:isNaN(i)?0:Math.max(0,Math.min(6,i))};}return {name:h};}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3200);}

function header(r){
  const inSess=r.name==='step';
  return `<header class="top gut${inSess?' insess':''}"><div class="col">
    <a class="brand" href="#home"><b>Spiritual</b> Care</a>
    ${inSess?`<span class="who">J.K. · Session 2</span>`:''}
    ${inSess?`<nav class="steplinks" aria-label="Session steps">${STEPS.map((s,i)=>`<a href="#s/${i}" class="${S.done.has(i)&&i!==r.i?'done':''}" aria-current="${i===r.i?'page':'false'}">${s[1]}</a>`).join('')}</nav>`:''}
    <span class="spacer"></span>
    ${inSess?`<button class="sync" data-s="${S.saved?'locked':'unsaved'}" data-act="save" title="Save and lock"><i></i>${S.saved?'Saved and locked':'Unsaved'}</button>`:''}
    <a class="hdr-learn" href="#learn" aria-current="${r.name==='learn'?'page':'false'}">${ICON_LEARN}<span>Learn</span></a>
  </div></header>`;
}
function stepbar(i){
  return `<nav class="stepbar" aria-label="Step navigation">
    <button class="nav" data-act="prev"${i===0?' disabled':''}>‹ Back</button>
    <button class="stepnow" data-act="sheet" aria-label="All steps"><small>STEP ${i+1} OF 7</small><b>${STEPS[i][1]}</b><span class="dots">${STEPS.map((s,k)=>`<i class="${k===i?'now':S.done.has(k)?'done':''}"></i>`).join('')}</span></button>
    <button class="nav primary" data-act="next">${i===6?'Finish':'Next ›'}</button>
  </nav>`;
}
function guide(key,lead,items){
  if(S.guideHidden[key])return `<button class="guide-mini" data-act="guide" data-k="${key}"><span>How to use this step</span><span class="guide-show">Show</span></button>`;
  return `<div class="guide"><div class="guide-head"><h3 class="sec">HOW TO USE THIS STEP</h3><button class="btn ghost" style="min-height:32px;padding:2px 6px" data-act="guide" data-k="${key}">Hide</button></div>
    <p class="guide-lead">${lead}</p><ul>${items.map(x=>`<li>${x}</li>`).join('')}</ul><a class="btn ghost" style="align-self:flex-start;padding-left:0" href="#learn">Read the full teaching in Learn</a></div>`;
}
function compare(t){return `<p class="compare"><b>What changed from v3:</b> ${t}</p>`;}

/* ---------- screens ---------- */
function homeHTML(){
  return `<div class="stack-lg">
    <div><p class="eyebrow">SPIRITUAL CARE SESSION TOOL</p><h2 class="big">"He has sent me to bind up the brokenhearted."</h2><p class="ref" style="margin:4px 0 0">Isaiah 61:1</p></div>
    <div class="actions">
      <a class="act" href="#s/0" style="text-decoration:none;color:inherit"><span class="glyph">+</span><div><b>New session</b><span>Begin with someone new</span></div></a>
      <button class="act" data-act="open"><span class="glyph">↻</span><div><b>Continue</b><span>Open a person's locked file</span></div></button>
      <button class="act" data-act="intake"><span class="glyph">✎</span><div><b>Client intake</b><span>For the person seeking care</span></div></button>
    </div>
    ${guide('home','A session moves through seven steps, in order. Safety always comes before ministry.',['<b>Intake</b>: their story and family genogram','<b>Safety</b> and <b>Triage</b>: what you are really looking at','<b>Doors</b> and <b>Discern</b>: entry points and the seven tests','<b>Ministry</b> and <b>Plan</b>: walk the steps, then send them home with Scripture'])}
    <div class="card flat"><h3 class="sec">YOUR FILES STAY WITH YOU</h3><p style="margin:0">Each person has one locked file. Nothing is stored here or sent anywhere. Open their file to continue where you left off.</p></div>
    ${compare('the start screen becomes a home screen like Akouō\'s Today, with three clear doors and a guide that shrinks away once you know your way around.')}
  </div>`;
}
function intakeHTML(){
  return `<div class="stack-lg">
    <div><p class="eyebrow">STEP 1 · LISTEN FIRST</p><h2 class="big">Their story</h2></div>
    ${guide('intake','Warmth first, information second. Let them tell their story before you reach for a category.',['Italic lines are questions you can ask aloud.','Listen for the wound beneath the presenting problem.','The genogram carries forward to every session.'])}
    <section class="stack"><h3 class="sec">WHAT BROUGHT YOU IN</h3><p class="ask">Tell me what brought you in today.</p>
      <label class="fld"><textarea id="d-reason">Waking at 3 a.m. with dread most nights for about two years. Feels like something in the room.</textarea></label></section>
    <section class="stack"><h3 class="sec">FAMILY GENOGRAM</h3>
      <a class="card" href="#s/0" style="text-decoration:none;color:inherit" data-act="geno"><div class="geno-mini">
        <svg viewBox="0 0 120 92" aria-hidden="true"><path class="gl" d="M24,18 V30 H50 V18 M37,30 V44 M70,18 V30 H96 V18 M83,30 V44 M37,44 H83 M60,44 V60 M40,60 H80 M40,60 V66 M80,60 V66"/><rect class="gs ga" x="16" y="6" width="16" height="16"/><circle class="gs" cx="50" cy="14" r="8"/><rect class="gs" x="62" y="6" width="16" height="16"/><circle class="gs" cx="96" cy="14" r="8"/><rect class="gs ga" x="29" y="40" width="16" height="16" transform="translate(0,-4)"/><circle class="gs" cx="83" cy="44" r="8"/><rect class="gs" x="32" y="66" width="16" height="16"/><rect x="29" y="63" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1"/><rect class="gs ga" x="72" y="66" width="16" height="16"/></svg>
        <div><b style="font-family:var(--f-display);font-size:1.15rem">12 people across 3 generations</b><span class="muted small" style="display:block">Addiction in 3 generations · Faith in 2</span><span class="pill" data-v="warn" style="margin-top:6px">1 door to confirm</span></div></div></a></section>
    <section class="stack"><h3 class="sec">SPIRITUAL LIFE</h3>
      <div class="row2"><label class="fld"><span>Closest to God when</span><textarea>Worship on Sunday mornings</textarea></label><label class="fld"><span>Farthest from God when</span><textarea>Alone at night</textarea></label></div></section>
    ${compare('larger, warmer type; 16px fields so an iPhone no longer zooms when you tap; the genogram summarised in one card that opens the full diagram.')}
  </div>`;
}
const SAFE=["Thoughts of suicide, plans, or attempts","Self-harm","Violence toward self or others","Hearing voices or paranoia (assess with a professional first)","Someone unsafe at home","Active substance dependency"];
function safetyHTML(){
  const any=S.safety.size;
  return `<div class="stack-lg">
    <div><p class="eyebrow">STEP 2 · ALWAYS FIRST</p><h2 class="big">Is everyone safe?</h2></div>
    <p class="ask">Any thoughts of harming yourself or others? Is anyone unsafe at home?</p>
    <ul class="list">${SAFE.map((s,i)=>`<li><label class="check flag${S.safety.has(i)?' on':''}"><input type="checkbox" data-safe="${i}"${S.safety.has(i)?' checked':''}><span><b>${s}</b></span></label></li>`).join('')}</ul>
    ${any?`<div class="verdict" data-v="stop"><b>Referral indicated</b><p>Pastoral care continues, but involve a licensed professional before or alongside any deliverance or healing work. Where there is immediate danger, call 911.</p><p class="next">YOUR REFERRAL: Prairie Mountain Health Crisis Line · 1-888-379-7699</p></div>`
      :`<div class="verdict" data-v="go"><b>No risks marked</b><p>Continue to triage. Come back here if anything changes during the session.</p></div>`}
    ${compare('the result changes colour as you mark (green to red), and your own referral line appears right where you need it.')}
  </div>`;
}
function triageHTML(){
  const k=S.kinds,d=S.depth;
  let v='',vb='',vt='Make your marks above to see the road ahead.';
  if(d==='none'){v='go';vb='Care and discipleship';vt='No deliverance. Look for wounds to heal and sin to repent of.';}
  else if(d==='foothold'){v='warn';vb='Oppression or foothold';vt='An area, not the whole person. Repentance and healing prepare the ground before any ministry.';}
  else if(d==='heavy'){v='stop';vb='Heavy bondage';vt='Gather a team before ministry. Do not rush. Consider prayer and fasting (Mark 9:29).';}
  else if(d==='unclear'){v='warn';vb='Uncertain';vt='Conclude nothing today. Let the seven tests and fruit over time decide.';}
  return `<div class="stack-lg">
    <div><p class="eyebrow">STEP 3 · NAME IT HONESTLY</p><h2 class="big">What are we looking at?</h2></div>
    ${guide('triage','Do not treat an ordinary struggle as a demon, and do not miss a real one.',['Mark every kind that applies; most situations are layered.','Then choose how deep, only if a spirit may be involved.'])}
    <section class="stack"><h3 class="sec">WHAT KIND OF PROBLEM</h3><div class="chips">
      ${[['natural','Ordinary struggle'],['root','Spiritual root'],['demonic','Possible demonic']].map(([v2,l])=>`<button class="chip" data-kind="${v2}" aria-pressed="${k.has(v2)}">${l}</button>`).join('')}</div></section>
    <section class="stack"><h3 class="sec">HOW DEEP</h3><div class="chips">
      ${[['none','No demonic element'],['foothold','Foothold'],['heavy','Heavy bondage'],['unclear','Uncertain']].map(([v2,l])=>`<button class="chip" data-depth="${v2}" aria-pressed="${d===v2}">${l}</button>`).join('')}</div></section>
    <div class="verdict" data-v="${v}">${vb?`<b>${vb}</b>`:''}<p>${vt}</p>${vb?`<p class="next">NEXT: ${d==='none'?'DOORS, DISCERN, PLAN · SKIP MINISTRY':'DOORS, DISCERN, MINISTRY'}</p>`:''}</div>
    ${compare('chips instead of long radio cards; the "what happens next" box takes a colour so the road is clear at a glance.')}
  </div>`;
}
function doorsHTML(){
  const C=[["Occult and false-spiritual doors",["Ouija board or contacting the dead","Tarot, fortune telling","Covenants or vows to a spirit"],0],["Sexual doors",["Pornography","Ungodly soul ties"],0],["Persistent sin and footholds",["Unforgiveness or bitterness","Fear that controls","Addiction"],2],["Generational doors",["Addiction in the family line (from genogram)","Occult in the family line","Divorce or family fracture"],1],["Wounds done to us",["Abandonment or rejection","A lie believed about self"],1]];
  return `<div class="stack-lg">
    <div><p class="eyebrow">STEP 4 · ENTRY POINTS</p><h2 class="big">Open doors</h2></div>
    <p class="muted" style="margin:0">Doors, not a diagnosis. Open a group to mark what applies.</p>
    <div class="stack">${C.map(([t,items,n],ci)=>`<details class="more"${ci===3?' open':''}><summary><b>${t}</b>${n?`<span class="pill" data-v="${ci===4?'go':'warn'}">${n} marked</span>`:''}</summary>
      ${ci===4?'<p class="note">Things done to the person. Healing, not confession.</p>':''}
      <ul class="list">${items.map((it,ii)=>`<li><label class="check${ii<n?' on':''}"><input type="checkbox"${ii<n?' checked':''}><span><b>${it}</b></span></label></li>`).join('')}</ul></details>`).join('')}</div>
    ${compare('each group folds away with a count of what is marked, so the step fits on a phone screen instead of a long scroll.')}
  </div>`;
}
const TESTS=[["christ","Christological","Does it confess Jesus Christ come in the flesh?","1 John 4:1-3"],["scripture","Scripture","Does it agree with what God has said?","Isa 8:20"],["selfcontrol","Self-control","Is the person's will intact?","1 Cor 14:32"],["edify","Edification","Does it build up in love?","1 Cor 14:26"],["body","Body discernment","Has it been weighed by others?","1 Cor 14:29"],["fruit","Fruit","What is it producing over time?","Matt 7:15-20"],["trajectory","Trajectory","Is the life bending toward Christ?","Matt 7:16-20"]];
function discernHTML(){
  const t=S.tests,vals=Object.values(t),fails=vals.filter(x=>x==='fail').length,unc=vals.filter(x=>x==='unclear').length;
  const v=fails?'stop':unc?'warn':vals.length?'go':'';
  return `<div class="stack-lg">
    <div><p class="eyebrow">STEP 5 · TEST THE SOURCE</p><h2 class="big">The seven tests</h2><p class="muted" style="margin:6px 0 0">The form of a thing is not its identity.</p></div>
    <div class="card"><div class="tlist">${TESTS.map(([k,n,q,r],i)=>`<div class="test"><div class="test-head"><div class="q"><b><span class="tn">${i+1}</span>${n}</b><span class="muted small">${q} · ${r}</span>${i>=5?' <span class="pill">OVER TIME</span>':''}${k==='fruit'?'<div class="prior">Last session: Unclear</div>':''}</div>
      <div class="seg" role="group" aria-label="${n}">${[['pass','Passes'],['unclear','Unclear'],['fail','Fails']].map(([v2,l])=>`<button data-test="${k}" data-v="${v2}" aria-pressed="${t[k]===v2}">${l}</button>`).join('')}</div></div></div>`).join('')}</div></div>
    <div class="verdict" data-v="${v}"><b>${fails?fails+' test'+(fails>1?'s':'')+' failed':unc?'Still weighing':'So far it holds'}</b><p>${fails?'Treat this with caution and weigh it with others before any ministry.':unc?'Leave the unclear tests open and watch the fruit in the weeks ahead.':'Keep testing over time. Fruit decides.'}</p></div>
    ${compare('the same green, amber and red buttons as Weigh a Word in Akouō, so your seven tests look and work the same in both apps.')}
  </div>`;
}
function ministryHTML(){
  const M=[["Establish authority","In Jesus' name (Luke 10:19). No fear, no begging."],["Address the spirit, not the person","Command, do not converse."],["Break agreements","Renounce the lies; forgiveness releases footholds (Eph 4:26-27)."],["Command release","Short, confident, in Jesus' name."],["Fill the house","Holy Spirit, disciplines, community (Luke 11:24-26)."]];
  return `<div class="stack-lg">
    <div><p class="eyebrow">STEP 6 · WALK IT, DO NOT RUSH IT</p><h2 class="big">Ministry</h2></div>
    <section class="stack"><h3 class="sec">LISTEN BEFORE YOU PRAY</h3><label class="fld"><textarea placeholder="What the Spirit brought to mind"></textarea></label></section>
    <section class="stack"><h3 class="sec">THE FIVE STEPS</h3><ul class="list">${M.map(([a,b],i)=>`<li><label class="check${i<1?' on':''}"><input type="checkbox"${i<1?' checked':''}><span><b>${a}</b><small>${b}</small></span></label></li>`).join('')}</ul></section>
    <div class="verdict" data-v="stop"><b>Guardrails</b><p>Command, do not converse. No theatrics. Protect dignity. Never alone.</p></div>
    ${compare('the five steps read as a checklist you tick as you go, like Next Steps in Akouō.')}
  </div>`;
}
function planHTML(){
  return `<div class="stack-lg">
    <div><p class="eyebrow">STEP 7 · SEND THEM HOME</p><h2 class="big">The plan</h2></div>
    <div class="verdict" data-v="warn"><b>Trauma, with a generational pattern</b><p>Lead with healing prayer. Work the generational pathway next session.</p></div>
    <div class="actions" style="grid-template-columns:repeat(2,minmax(0,1fr))">
      <button class="act" data-act="print"><span class="glyph">▤</span><div><b>Full plan</b><span>Confidential, for your file</span></div></button>
      <button class="act" data-act="print"><span class="glyph">✉</span><div><b>Handout</b><span>Scripture and steps for them</span></div></button>
    </div>
    <section class="stack"><h3 class="sec">YOUR STEPS THIS WEEK</h3><ul class="list">${["Read Psalm 34 each morning","Pray the daily prayer on your handout","Tell one trusted person what we prayed about"].map(s=>`<li><label class="check"><input type="checkbox"><span><b>${s}</b></span></label></li>`).join('')}</ul></section>
    <button class="btn primary" data-act="save" style="align-self:flex-start">Save and lock</button>
    ${compare('two large print choices instead of a row of small buttons; homework shown the way the person will see it.')}
  </div>`;
}
const LESSONS=[["The seven tests","How do we test what we sense?",["The form of a thing is not its identity. Saul prophesied under the Spirit and under an evil spirit.","Four tests can be applied in the room: Christ, Scripture, self-control, edification.","Three need others and time: the body, fruit, and trajectory."],"Test the source, not the spectacle."],["Possession or oppression","Can a believer have a demon?",["A believer belongs to Christ and cannot be possessed.","A believer can be oppressed, or give the enemy a foothold in one area (Eph 4:27).","A person is more than one room."],"Most problems are ordinary or rooted in a wound."],["Fill the house","Why is cleansing not enough?",["A swept, empty house ends worse (Luke 11:24-26).","Deliverance opens a door; discipleship decides what walks through it."],"Filling is not optional."],["Generational patterns","What passes down, and what does not?",["Guilt is not inherited (Ezek 18:20).","Effects can carry on where a pattern is repeated (Ex 20:5), yet God's love reaches a thousand generations (Ex 20:6).","Christ became a curse for us (Gal 3:13)."],"This is not about judging family. It is about the pattern ending here."],["When to refer","Where does pastoral care stop?",["Safety comes before ministry.","Hearing voices, plans of self-harm, or danger at home call for a professional first.","Referring is not failure; it is wisdom."],"Pastoral care continues alongside treatment, never instead of it."]];
function learnHTML(){
  return `<div class="stack-lg">
    <div><p class="eyebrow">LEARN</p><h2 class="big">The teaching behind each step</h2><p class="muted" style="margin:6px 0 0">For your own review, and for training others who minister with you.</p></div>
    <div class="stack">${LESSONS.map(([t,q,ideas,bal],i)=>`<details class="lesson"${i===0?' open':''}><summary><span class="lnum">${i+1}</span><span class="ltitle"><b>${t}</b><span>${q}</span></span></summary>
      <div class="lbody"><ul class="ideas">${ideas.map(x=>`<li>${x}</li>`).join('')}</ul><div class="balance"><b>Hold the balance.</b> ${bal}</div></div></details>`).join('')}</div>
    ${compare('the long "How to use this section" boxes move here, so session screens stay clean during ministry.')}
  </div>`;
}
const SCREENS=[intakeHTML,safetyHTML,triageHTML,doorsHTML,discernHTML,ministryHTML,planHTML];

function render(){
  const r=route();
  let body='',cls='';
  if(r.name==='step')body=SCREENS[r.i]();else if(r.name==='learn'){body=learnHTML();cls='home';}else{body=homeHTML();cls='home';}
  document.getElementById('app').innerHTML=header(r)+`<main class="gut ${cls}"><div class="col">${body}</div></main>`+(r.name==='step'?stepbar(r.i):'')+
    (S.sheet&&r.name==='step'?`<div class="sheet-back" data-act="close"><div class="sheet" role="dialog" aria-label="All steps"><div class="grab"></div><h3 class="sec">ALL STEPS</h3><ul class="list">${STEPS.map((s,i)=>`<li><a class="check" href="#s/${i}" style="text-decoration:none;color:inherit;grid-template-columns:28px 1fr auto"><span class="tn" style="margin:0">${i+1}</span><b>${s[1]}</b>${i===r.i?'<span class="pill" data-v="go">HERE</span>':S.done.has(i)?'<span class="pill">DONE</span>':''}</a></li>`).join('')}</ul></div></div>`:'');
}
document.addEventListener('click',e=>{
  const r=route(),el=e.target.closest('[data-act],[data-test],[data-kind],[data-depth]');if(!el)return;
  if(el.dataset.test){S.tests[el.dataset.test]=el.dataset.v;S.saved=false;render();return;}
  if(el.dataset.kind){const k=el.dataset.kind;S.kinds.has(k)?S.kinds.delete(k):S.kinds.add(k);S.saved=false;render();return;}
  if(el.dataset.depth){S.depth=S.depth===el.dataset.depth?'':el.dataset.depth;S.saved=false;render();return;}
  const a=el.dataset.act;
  if(a==='next'){if(r.i===6){toast('In the real tool, Finish saves and locks the file.');return;}S.done.add(r.i);location.hash='#s/'+(r.i+1);}
  else if(a==='prev')location.hash='#s/'+Math.max(0,r.i-1);
  else if(a==='sheet'){S.sheet=true;render();}
  else if(a==='close'&&e.target===el){S.sheet=false;render();}
  else if(a==='guide'){S.guideHidden[el.dataset.k]=!S.guideHidden[el.dataset.k];render();}
  else if(a==='save'){S.saved=true;render();toast('Saved and locked: spiritual_care_session_JK.json');}
  else if(a==='open')toast('In the real tool, this opens a locked file and asks for its passphrase.');
  else if(a==='intake')toast('In the real tool, this opens the gentle client intake.');
  else if(a==='print')toast('In the real tool, this opens the print dialog.');
  else if(a==='geno'){e.preventDefault();toast('In the real tool, this opens the full interactive genogram.');}
});
document.addEventListener('change',e=>{if(e.target.dataset.safe!==undefined){const i=+e.target.dataset.safe;e.target.checked?S.safety.add(i):S.safety.delete(i);S.saved=false;render();}
  else if(e.target.type==='checkbox'){const l=e.target.closest('.check');if(l)l.classList.toggle('on',e.target.checked);S.saved=false;const s=document.querySelector('.sync');if(s){s.dataset.s='unsaved';s.lastChild.textContent='Unsaved';}}});
window.addEventListener('hashchange',()=>{S.sheet=false;render();window.scrollTo(0,0);});
render();
</script>
